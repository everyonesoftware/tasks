name: Publish Tasks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishers; the remote-head tag check also protects old run replays.
concurrency:
  group: publish-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_android: ${{ steps.select.outputs.build_android }}
      build_windows: ${{ steps.select.outputs.build_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute shared commit-count version
        id: version
        run: |
          version="$(bash scripts/build-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Build version: $version ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Select changed application platforms from verified publications
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/selective-builds.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test and vet server and deployment
        env:
          DAYMARK_EXPECT_VERSION: ${{ steps.version.outputs.version }}
          DAYMARK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          go test -race -ldflags="-X github.com/everyonesoftware/tasks/services/server.Version=$DAYMARK_VERSION" ./...
          go vet ./...
      - name: Test web helpers
        run: node --test tests/web/*.test.mjs
      - name: Test combined release orchestration
        run: |
          node --test tests/deployment/windows_release_workflow.test.mjs
          node --test tests/deployment/selective-builds.test.mjs
      - name: Test Windows packaging and lifecycle helpers
        run: node --test tests/windows/*.test.mjs

  container:
    outputs:
      services_artifact: ${{ steps.services_capture.outputs.artifact }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Choose tags without rolling back latest on old reruns
        id: tags
        env:
          DAYMARK_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tags="$(bash scripts/container-tags.sh "$DAYMARK_VERSION" "$GITHUB_SHA")"
          {
            echo 'tags<<DAYMARK_IMAGE_TAGS'
            echo "$tags"
            echo 'DAYMARK_IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js for Services payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and publish web and server image
        id: services_push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Capture original Services publication metadata
        id: services_capture
        continue-on-error: true
        env:
          PUBLISHED_DIGEST: ${{ steps.services_push.outputs.digest }}
          PUBLISHED_TAGS: ${{ steps.tags.outputs.tags }}
          APP_VERSION: ${{ needs.validate.outputs.version }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs capture

      - name: Retain original Services payload for notification-only retries
        if: steps.services_capture.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.services_capture.outputs.artifact }}
          path: ${{ runner.temp }}/services-publish/published.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
          archive: true

  android:
    if: needs.validate.outputs.build_android == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DAYMARK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Test and lint Android
        working-directory: apps/android
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug --console=plain --max-workers=2
      - name: Build signed release APK
        working-directory: apps/android
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYMARK_KEYSTORE_BASE64 }}
          DAYMARK_KEYSTORE_PASSWORD: ${{ secrets.DAYMARK_KEYSTORE_PASSWORD }}
          DAYMARK_KEY_ALIAS: ${{ secrets.DAYMARK_KEY_ALIAS }}
          DAYMARK_KEY_PASSWORD: ${{ secrets.DAYMARK_KEY_PASSWORD }}
          DAYMARK_KEYSTORE_PATH: ${{ runner.temp }}/daymark-release.p12
        run: |
          for name in KEYSTORE_BASE64 DAYMARK_KEYSTORE_PASSWORD DAYMARK_KEY_ALIAS DAYMARK_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android signing secret: $name. See docs/ci-publishing.md."
              exit 1
            fi
          done
          umask 077
          trap 'rm -f "$DAYMARK_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$DAYMARK_KEYSTORE_PATH"
          bash gradlew :app:assembleRelease --console=plain --max-workers=2 --no-daemon
      - name: Verify and stage APK
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          badging="$("$tools/aapt2" dump badging "$apk")"
          expected="package: name='com.everyonesoftware.daymark' versionCode='$DAYMARK_VERSION' versionName='$DAYMARK_VERSION'"
          [[ "$badging" == "$expected"* ]]
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo '::error::Release APK must not be debuggable.'
            exit 1
          fi
          mkdir -p dist/android
          cp "$apk" "dist/android/Tasks-$DAYMARK_VERSION.apk"
          sha256sum "dist/android/Tasks-$DAYMARK_VERSION.apk" > dist/android/SHA256SUMS
          sdk_pattern="^(minSdkVersion|sdkVersion):'([0-9]+)'$"
          min_sdk=
          while IFS= read -r line; do
            if [[ "$line" =~ $sdk_pattern ]]; then
              min_sdk=${BASH_REMATCH[2]}
              break
            fi
          done <<< "$badging"
          [[ "$min_sdk" =~ ^[1-9][0-9]*$ && "$min_sdk" -le 1000 ]]
          checksum=$(sha256sum "dist/android/Tasks-$DAYMARK_VERSION.apk")
          checksum=${checksum%% *}
          printf '{"schemaVersion":1,"packageName":"com.everyonesoftware.daymark","versionName":"%s","versionCode":%s,"minSdk":%s,"apkAssetName":"Tasks-%s.apk","sha256":"%s"}\n' \
            "$DAYMARK_VERSION" "$DAYMARK_VERSION" "$min_sdk" "$DAYMARK_VERSION" "$checksum" \
            > dist/android/tasks-release.json
          cp dist/android/tasks-release.json dist/android/daymark-release.json
          echo "Signed Android version/build: $DAYMARK_VERSION ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tasks-android-${{ needs.validate.outputs.version }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/daymark-release.p12"

  windows:
    if: needs.validate.outputs.build_windows == 'true'
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DAYMARK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: apps/windows/global.json
      - name: Test Windows helpers and shell contracts
        run: |
          $windowsTests = @(Get-ChildItem tests/windows -Filter '*.test.mjs' -File | ForEach-Object FullName)
          if ($windowsTests.Count -eq 0) { throw 'Windows tests were not found.' }
          node --test @windowsTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Pinned Velopack owns installation; Inno is only an unregistered legacy guard.
      - name: Build Windows installer
        run: pwsh ./scripts/build-windows-installer.ps1 -BuildNumber $env:DAYMARK_VERSION -AllowUnsigned
      - name: Test Windows installer lifecycle
        id: lifecycle
        timeout-minutes: 5
        run: pwsh ./scripts/test-windows-installer.ps1 -InstallerPath "dist/windows/Tasks-Windows-$env:DAYMARK_VERSION-Setup.exe" -EvidenceDirectory "$env:RUNNER_TEMP/tasks-windows-evidence"
      - name: Diagnose native startup failure
        if: failure() && steps.lifecycle.outcome == 'failure'
        timeout-minutes: 4
        env:
          WINAPP_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'tasks-windows-evidence'
          $exitFile = Join-Path $evidence 'app-exit.json'
          if (Test-Path -LiteralPath $exitFile) {
            $exitInfo = Get-Content -LiteralPath $exitFile -Raw | ConvertFrom-Json
            if ($exitInfo.hasExited -and $null -ne $exitInfo.exitCode -and $exitInfo.exitCode -ne 0) {
              $toolDirectory = Join-Path $env:RUNNER_TEMP 'winapp-0.8.0'
              $archive = Join-Path $env:RUNNER_TEMP 'winappcli-x64.zip'
              Invoke-WebRequest 'https://github.com/microsoft/winappCli/releases/download/v0.8.0/winappcli-x64.zip' -OutFile $archive
              if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '67a8e1d39421a5ef5309c7017327c6a70ea6215a0e56e47ec22a7e9ec3b914e6') {
                throw 'WinApp diagnostic tool checksum mismatch'
              }
              Expand-Archive $archive -DestinationPath $toolDirectory
              try {
                & "$toolDirectory/winapp.exe" run apps/windows/Tasks.App/Tasks.App.csproj --no-build --configuration Release --debug-output --symbols 2>&1 | Tee-Object (Join-Path $evidence 'native-debugger.txt')
              } finally {
                $logs = Join-Path $env:TEMP 'winapp-dumps'
                if (Test-Path $logs) { Copy-Item "$logs/*.log" $evidence -ErrorAction Continue }
              }
            }
          }
      - name: Retain Windows lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tasks-windows-evidence-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/tasks-windows-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tasks-windows-${{ needs.validate.outputs.version }}
          path: |
            dist/windows/Tasks-Windows-${{ needs.validate.outputs.version }}-Setup.exe
            dist/windows/Tasks-Windows-${{ needs.validate.outputs.version }}-Setup.exe.sha256
            dist/windows/TasksWindows-win-x64-Setup.exe
            dist/windows/TasksWindows-win-x64-Setup.exe.sha256
            dist/windows/TasksWindows-0.1.${{ needs.validate.outputs.version }}-win-x64-full.nupkg
            dist/windows/releases.win-x64.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [validate, android, windows]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped') && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (needs.validate.outputs.build_android == 'true' || needs.validate.outputs.build_windows == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DAYMARK_VERSION: ${{ needs.validate.outputs.version }}
      BUILD_ANDROID: ${{ needs.validate.outputs.build_android }}
      BUILD_WINDOWS: ${{ needs.validate.outputs.build_windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.build_android == 'true'
        with:
          name: Tasks-android-${{ needs.validate.outputs.version }}
          path: dist/android
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.validate.outputs.build_windows == 'true'
        with:
          name: Tasks-windows-${{ needs.validate.outputs.version }}
          path: dist/windows
          digest-mismatch: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$DAYMARK_VERSION"
          verify_tag() {
            local allow_missing=$1 remote sha ref tag_sha= peeled_sha=
            remote=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}") || return 1
            if [[ -z "$remote" && "$allow_missing" == true ]]; then
              return 0
            fi
            while read -r sha ref; do
              case "$ref" in
                "refs/tags/$tag") tag_sha=$sha ;;
                "refs/tags/$tag^{}") peeled_sha=$sha ;;
              esac
            done <<< "$remote"
            sha=${peeled_sha:-$tag_sha}
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ || "$sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag $tag must resolve to build commit $GITHUB_SHA (found ${sha:-missing})."
              return 1
            fi
          }
          remote=$(git ls-remote --exit-code origin refs/heads/main)
          read -r main_sha _ <<< "$remote"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          latest=false
          if [[ "$GITHUB_SHA" == "$main_sha" && "$BUILD_ANDROID" == true ]]; then
            latest=true
          fi
          [[ "$BUILD_ANDROID" == true || "$BUILD_ANDROID" == false ]]
          [[ "$BUILD_WINDOWS" == true || "$BUILD_WINDOWS" == false ]]
          files=()
          if [[ "$BUILD_ANDROID" == true ]]; then
            files+=("dist/android/Tasks-$DAYMARK_VERSION.apk" dist/android/tasks-release.json dist/android/daymark-release.json dist/android/SHA256SUMS)
          fi
          if [[ "$BUILD_WINDOWS" == true ]]; then
            files+=("dist/windows/Tasks-Windows-$DAYMARK_VERSION-Setup.exe" "dist/windows/Tasks-Windows-$DAYMARK_VERSION-Setup.exe.sha256"
              dist/windows/TasksWindows-win-x64-Setup.exe dist/windows/TasksWindows-win-x64-Setup.exe.sha256
              "dist/windows/TasksWindows-0.1.$DAYMARK_VERSION-win-x64-full.nupkg" dist/windows/releases.win-x64.json)
          fi
          [[ ${#files[@]} -gt 0 ]]
          verify_tag true
          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Tasks $DAYMARK_VERSION" --generate-notes \
            --draft=false --prerelease=false --latest="$latest"
          verify_tag false
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .assets[] | select(.state == "uploaded") | .name')
          for asset in "${files[@]}"; do
            grep -Fxq "${asset##*/}" <<< "$assets"
          done
          echo "Published $tag: Android selected=$BUILD_ANDROID, Windows selected=$BUILD_WINDOWS; build $DAYMARK_VERSION ($GITHUB_SHA). Unchanged outputs remain in their original releases." >> "$GITHUB_STEP_SUMMARY"

  services_notify:
    name: Notify Services (publication remains separate)
    needs: container
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && needs.container.result == 'success' && vars.SERVICES_PUBLISH_NOTIFICATIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require original payload artifact
        env:
          PAYLOAD_ARTIFACT: ${{ needs.container.outputs.services_artifact }}
        run: test -n "$PAYLOAD_ARTIFACT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.container.outputs.services_artifact }}
          path: ${{ runner.temp }}/services-publish
          digest-mismatch: error
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: ${{ vars.TAILSCALE_TAGS }}
          log-mode: quiet
      - name: Send the retained original payload without rebuilding
        env:
          SERVICES_PUBLISH_URL: ${{ vars.SERVICES_PUBLISH_URL }}
          SERVICES_PUBLISH_TOKEN: ${{ secrets.SERVICES_PUBLISH_TOKEN }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs send
