services:
  tasks:
    image: ghcr.io/everyonesoftware/tasks:latest
    restart: unless-stopped
    read_only: true
    environment:
      TASKS_HOST: ${TASKS_HOST:?Set TASKS_HOST}
    ports:
      - "127.0.0.1:${DAYMARK_PORT:-8787}:8787"
    volumes:
      - tasks-data:/data
volumes:
  tasks-data:
